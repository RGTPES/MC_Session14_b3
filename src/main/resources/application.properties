spring.application.name=Session14_b3
server.port=8080

# RabbitMQ Connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Saga Exchange
saga.exchange=saga.exchange

# Queue names
saga.queue.order-created=queue.order.created
saga.queue.payment-success=queue.payment.success
saga.queue.payment-failed=queue.payment.failed
saga.queue.shipping-success=queue.shipping.success
saga.queue.shipping-failed=queue.shipping.failed
saga.queue.compensate-payment=queue.compensate.payment
saga.queue.refund-success=queue.refund.success

# Routing keys
saga.routing.order-created=order.created
saga.routing.payment-success=payment.success
saga.routing.payment-failed=payment.failed
saga.routing.shipping-success=shipping.success
saga.routing.shipping-failed=shipping.failed
saga.routing.compensate-payment=compensate.payment
saga.routing.refund-success=refund.success

# Shipping timeout (seconds)
saga.shipping.timeout-seconds=30

# Logging
logging.level.org.example=DEBUG
